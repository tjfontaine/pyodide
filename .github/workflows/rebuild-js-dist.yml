name: Rebuild JS dist

# Rebuilds pyodide.mjs / pyodide.js when only the JS wrapper changes.
# The WASM binary + stdlib are carried forward from the previous dist release.

on:
  push:
    branches: [edge-agent-wasmfs-030]
    paths:
      - 'src/js/**'
  workflow_dispatch:

permissions:
  contents: write  # needed for gh release create

jobs:
  rebuild-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute SHAs
        id: shas
        run: |
          CURRENT_SHA=$(git rev-parse HEAD | cut -c1-8)
          echo "current=$CURRENT_SHA" >> "$GITHUB_OUTPUT"

          # Find the most recent ancestor commit that has a release.
          # Use 8-char short SHAs to match our release tag convention.
          for sha in $(git log --format='%H' -20 HEAD~1 | cut -c1-8); do
            TAG="pyodide-dist-${sha}"
            if gh release view "$TAG" --json tagName -q .tagName >/dev/null 2>&1; then
              echo "previous=$sha" >> "$GITHUB_OUTPUT"
              echo "Found previous dist release: $TAG"
              break
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download previous dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV="${{ steps.shas.outputs.previous }}"
          if [ -z "$PREV" ]; then
            echo "::error::No previous dist release found in recent history."
            echo "A JS-only rebuild requires an existing dist with WASM artifacts."
            echo "Upload a full build first:"
            echo "  gh release create pyodide-dist-\$(git rev-parse --short HEAD) dist.tar.gz --repo tjfontaine/pyodide"
            exit 1
          fi

          TAG="pyodide-dist-${PREV}"
          echo "Downloading dist from release: $TAG"
          gh release download "$TAG" --pattern "pyodide-dist.tar.gz" --dir /tmp --clobber
          tar xzf /tmp/pyodide-dist.tar.gz
          echo "Previous dist contents:"
          ls -lh dist/

      - name: Validate previous dist has WASM artifacts
        run: |
          for f in pyodide.asm.wasm pyodide.asm.mjs python_stdlib.zip pyodide-lock.json; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Previous dist missing $f — need a full WASM rebuild on the Docker host"
              exit 1
            fi
          done
          echo "All WASM artifacts present"

      - name: Check for WASM/C source changes
        id: wasm-check
        run: |
          # If src/core/ or Makefile changed, a JS-only rebuild is insufficient.
          # Compare against the commit that produced the previous dist release.
          PREV_SHORT="${{ steps.shas.outputs.previous }}"
          if [ -z "$PREV_SHORT" ]; then
            echo "No previous release found — skipping WASM change check"
            exit 0
          fi

          PREV_FULL=$(git log --format='%H' -30 | while read sha; do
            if [ "$(echo "$sha" | cut -c1-8)" = "$PREV_SHORT" ]; then
              echo "$sha"
              break
            fi
          done)

          if [ -n "$PREV_FULL" ]; then
            WASM_CHANGES=$(git diff --name-only "$PREV_FULL" HEAD -- src/core/ Makefile cpython/ emsdk/ | head -5)
            if [ -n "$WASM_CHANGES" ]; then
              echo "::warning::WASM/C source files changed — JS-only rebuild may not be sufficient"
              echo "$WASM_CHANGES"
              echo "wasm_changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install JS dependencies
        working-directory: src/js
        run: npm ci

      - name: Verify jsverror.wasm present
        run: |
          # jsverror.wasm (90 bytes) is checked into the repo.
          # It's compiled from jsverror.wat using a WasmGC-capable toolchain
          # and changes very rarely.
          if [ ! -f src/core/jsverror.wasm ]; then
            echo "::error::src/core/jsverror.wasm missing — compile from jsverror.wat with a WasmGC-capable wat2wasm"
            exit 1
          fi
          echo "jsverror.wasm present ($(wc -c < src/core/jsverror.wasm) bytes)"

      - name: Rebuild JS bundle
        working-directory: src/js
        run: |
          # Type-check then bundle with esbuild
          npm run build
          echo "Rebuilt JS bundle:"
          ls -lh ../../dist/pyodide.mjs ../../dist/pyodide.js

      - name: Verify mount path in bundle
        run: |
          # Sanity check: confirm the built bundle has the expected mount
          if grep -q 'OPFS mounted at /' dist/pyodide.mjs; then
            echo "Mount path verified: OPFS at /"
          else
            MOUNT=$(grep -oP 'OPFS mounted at [^"\\]+' dist/pyodide.mjs || echo "(not found)")
            echo "::warning::Unexpected mount path: $MOUNT"
          fi

      - name: Package dist
        run: |
          tar czf /tmp/pyodide-dist.tar.gz dist/
          echo "Tarball size: $(du -h /tmp/pyodide-dist.tar.gz | cut -f1)"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pyodide-dist-${{ steps.shas.outputs.current }}"

          # Delete existing release if re-running
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          NOTES="JS-only rebuild of pyodide dist for ${{ steps.shas.outputs.current }}"
          if [ "${{ steps.wasm-check.outputs.wasm_changed }}" = "true" ]; then
            NOTES="$NOTES (warning: WASM source also changed — may need full rebuild)"
          fi

          gh release create "$TAG" /tmp/pyodide-dist.tar.gz \
            --title "Pyodide dist (${{ steps.shas.outputs.current }})" \
            --notes "$NOTES"

          echo "Release created: $TAG"
